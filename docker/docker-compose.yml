version: "3.9"

services:

  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: project-glory-web

    ports:
      - "${WEB_PORT}:80"

    volumes:
      - ..:/var/www/project-glory

    working_dir: /var/www/project-glory

    restart: unless-stopped

    depends_on:
      database:
        condition: service_healthy

  database:
    image: mariadb:11

    container_name: project-glory-db

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Kolkata

    ports:
      - "${DB_PORT}:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data: